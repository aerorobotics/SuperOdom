%YAML:1.0

#Rotation from laser frame to imu frame, imu^R_laser
# This represents the transformation from IMU frame to LiDAR frame
# Calculated as: laser^R_imu = laser^R_base * base^R_imu
# Where base^R_imu is from DLIO config and laser^R_base is identity
extrinsicRotation_imu_laser: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d  
  data: [0.,  1.,  0.,
         -1.,  0.,  0.,
          0.,  0., -1.]
  # Original identity matrix (commented out)
  # data: [1., 0., 0.,
  #       0., 1., 0.,
  #       0., 0., 1.]

#Translation from laser frame to imu frame, imu^T_laser
# Converted from DLIO extrinsics/baselink2imu/t: [ 0.0, 0.0, 0.0 ]
extrinsicTranslation_imu_laser: !!opencv-matrix
  rows: 3
  cols: 1
  dt: d
  data: [0.05, 0.0, -0.10]
  # Original translation (commented out)
  # data: [0.080, 0.029, 0.030]

# Rotation offset for fine-tuning (keep as zero since transformation is already correct)
imu_laser_rotation_offset: !!opencv-matrix
  rows: 3
  cols: 1
  dt: d
  data: [180.0, 0.0, 0.0] #[0.0, 0.5, 0.0]

yaw_ratio: 0.0
